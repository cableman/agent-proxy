<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Proxy</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --border:#334155; }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header, footer { display:flex; align-items:center; gap:12px; padding:14px 24px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  footer { border-bottom:0; border-top:1px solid var(--border); margin-top:auto; color:var(--muted); }
  h1 { font-size:18px; margin:0; }
  code { font-family:ui-monospace,monospace; font-size:12px; color:var(--muted); word-break:break-all; }
  .spacer { flex:1; }
  button { background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:6px 12px; cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:600; }
  button.danger { color:var(--err); }
  main { padding:24px; }
  .banner { background:#450a0a; color:#fecaca; border:1px solid var(--err); border-radius:8px; padding:12px 16px; margin-bottom:16px; display:flex; gap:12px; align-items:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .card h2 { font-size:16px; margin:0; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.enabled { background:var(--ok); } .dot.warning { background:var(--warn); } .dot.disabled { background:var(--err); }
  .sub { color:var(--muted); font-size:12px; }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px; background:#0f172a; border:1px solid var(--border); color:var(--muted); align-self:flex-start; }
  .badge.warn { color:var(--warn); border-color:var(--warn); }
  .hdr { font-family:ui-monospace,monospace; font-size:12px; }
  .actions { display:flex; gap:8px; margin-top:auto; padding-top:8px; }
  .unmanaged { font-style:italic; color:var(--muted); }
  .status { width:10px; height:10px; border-radius:50%; display:inline-block; }
  dialog { background:var(--card); color:var(--fg); border:1px solid var(--border); border-radius:12px; padding:24px; width:min(520px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h3 { margin:0 0 12px; }
  label { display:block; margin:10px 0 4px; color:var(--muted); font-size:12px; }
  input, textarea { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:8px; font:inherit; }
  textarea { font-family:ui-monospace,monospace; min-height:110px; }
  input:disabled { opacity:.6; }
  .err { color:var(--err); min-height:1.2em; margin-top:8px; white-space:pre-wrap; }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
</style>
</head>
<body>
<header>
  <h1>Agent Proxy</h1>
  <code id="resolved"></code>
  <span class="spacer"></span>
  <button id="openSettings">⚙ Settings</button>
  <button class="primary" id="newService">+ New service</button>
</header>
<main>
  <div class="banner" id="banner" hidden><span id="bannerText"></span><span class="spacer"></span><button onclick="openSettings()">⚙ Settings</button></div>
  <div class="grid" id="grid"></div>
</main>
<footer><span class="status" id="trDot"></span><span id="trText">…</span></footer>

<dialog id="edit">
  <form method="dialog" id="editForm">
    <h3 id="editTitle">New service</h3>
    <label for="name">Name (becomes <code>/name</code> prefix)</label>
    <input id="name" name="name" pattern="[a-z0-9][a-z0-9-]{0,63}" required autocomplete="off">
    <label for="upstream">Upstream URL</label>
    <input id="upstream" name="upstream" type="url" required placeholder="https://api.github.com">
    <label for="headers">Request headers — one <code>Key: Value</code> per line</label>
    <textarea id="headers" name="headers" placeholder="Authorization: Bearer ghp_xxx"></textarea>
    <div class="err" id="editErr"></div>
    <div class="row"><button type="button" onclick="edit.close()">Cancel</button><button class="primary" type="submit">Save</button></div>
  </form>
</dialog>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h3>Settings</h3>
    <label for="config">Traefik config path</label>
    <input id="config" name="config" placeholder="dynamic dir, dynamic .yml, or traefik.yml" required>
    <label for="traefik">Traefik API URL</label>
    <input id="traefik" name="traefik" type="url" required>
    <label for="base">Agent base URL (display only)</label>
    <input id="base" name="base" type="url" required>
    <label for="entryPoints">Entry points (comma-separated; empty = all)</label>
    <input id="entryPoints" name="entryPoints">
    <div class="err" id="settingsErr"></div>
    <div class="row"><button type="button" onclick="settings.close()">Cancel</button><button class="primary" type="submit">Save</button></div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
let base = 'http://localhost', services = [], routers = {}, cfg = {};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render() {
  $('grid').innerHTML = services.map(s => {
    if (!s.managed) return `<div class="card"><h2><span class="dot"></span>${esc(s.name)}</h2><div class="sub">${esc(s.source)}</div><div class="unmanaged">unmanaged (not in agent-proxy shape)</div></div>`;
    const keys = Object.keys(s.headers || {}).sort();
    const st = routers[s.name] || '';
    return `<div class="card">
      <h2><span class="dot ${esc(st)}" title="${esc(st || 'unknown')}"></span>${esc(s.name)}</h2>
      <div class="sub">${esc(s.source)}</div>
      <code>${esc(base.replace(/\/$/, ''))}/${esc(s.name)}/</code>
      <div>→ ${esc(s.upstream)}</div>
      <span class="badge ${keys.length ? '' : 'warn'}">${keys.length ? keys.length + ' header' + (keys.length > 1 ? 's' : '') : 'no headers'}</span>
      ${keys.map(k => `<div class="hdr">${esc(k)}: ••••••</div>`).join('')}
      <div class="actions"><button onclick="openEdit('${esc(s.name)}')">Edit →</button><button class="danger" onclick="del('${esc(s.name)}')">Delete</button></div>
    </div>`;
  }).join('');
}

async function loadStatus() {
  const st = await (await fetch('/api/status')).json();
  routers = st.traefik ? st.routers : {};
  $('trDot').style.background = st.traefik ? 'var(--ok)' : 'var(--err)';
  $('trText').textContent = st.traefik ? 'Traefik connected' : 'Traefik unreachable';
  render();
}

async function load() {
  const [sr, vr] = await Promise.all([fetch('/api/settings'), fetch('/api/services'), loadStatus()]);
  cfg = await sr.json();
  $('resolved').textContent = cfg.error ? '' : `${cfg.resolved} (${cfg.mode})`;
  $('banner').hidden = !cfg.error;
  $('bannerText').textContent = cfg.error || '';
  if (vr.ok) { const v = await vr.json(); base = v.base; services = v.services; }
  else { services = []; if (!cfg.error) alert(await vr.text()); }
  render();
}

function openEdit(name) {
  const s = services.find(x => x.name === name);
  $('editTitle').textContent = s ? `Edit ${name}` : 'New service';
  $('name').value = s ? s.name : '';
  $('name').disabled = !!s;
  $('upstream').value = s ? s.upstream : '';
  $('headers').value = s ? Object.entries(s.headers || {}).map(([k, v]) => `${k}: ${v}`).join('\n') : '';
  $('editErr').textContent = '';
  edit.showModal();
}

function openSettings() {
  for (const k of ['config', 'traefik', 'base', 'entryPoints']) $(k).value = cfg[k] || '';
  $('settingsErr').textContent = '';
  settings.showModal();
}

async function del(name) {
  if (!confirm(`Delete service "${name}"?`)) return;
  const r = await fetch(`/api/services/${encodeURIComponent(name)}`, { method: 'DELETE' });
  if (!r.ok) alert(await r.text());
  load();
}

$('editForm').onsubmit = async e => {
  e.preventDefault();
  const headers = {};
  for (const line of $('headers').value.split('\n')) {
    if (!line.trim()) continue;
    const i = line.indexOf(':');
    if (i < 0) { $('editErr').textContent = `header line "${line}": expected Key: Value`; return; }
    headers[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  const r = await fetch(`/api/services/${encodeURIComponent($('name').value)}`, {
    method: 'PUT', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ upstream: $('upstream').value, headers })
  });
  if (!r.ok) { $('editErr').textContent = await r.text(); return; }
  edit.close(); load();
};

$('settingsForm').onsubmit = async e => {
  e.preventDefault();
  const body = {};
  for (const k of ['config', 'traefik', 'base', 'entryPoints']) body[k] = $(k).value;
  const r = await fetch('/api/settings', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { $('settingsErr').textContent = await r.text(); return; }
  settings.close(); location.reload();
};

$('openSettings').onclick = openSettings;
$('newService').onclick = () => openEdit('');
load();
setInterval(loadStatus, 5000);
</script>
</body>
</html>
